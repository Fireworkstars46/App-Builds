name: Publish DisneyNOW Fire TV Build 3 signed APK

on:
  push:
    branches: [main]
    paths:
      - 'DisneyNOWFireTV/Build3/Publish/**'

permissions:
  contents: write

jobs:
  publish-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact signed APK
        shell: bash
        run: |
          set -euo pipefail
          PUB='DisneyNOWFireTV/Build3/Publish'
          OUTDIR='DisneyNOWFireTV/Releases/v0.1-Build3-Compatibility-Test'
          APK="$OUTDIR/DisneyNOW-Fire-TV-v0.1-Build3-Permanent-Signed.apk"
          mkdir -p "$OUTDIR"

          # The first 27,000 APK bytes are represented as exact base64 text parts.
          cat "$PUB"/part00.txt "$PUB"/part01.txt "$PUB"/part02.txt "$PUB"/part03.txt "$PUB"/part04.txt "$PUB"/part05.txt > /tmp/build3-prefix.b64
          base64 -d /tmp/build3-prefix.b64 > "$APK"

          # Append the remaining exact binary regions. Long zero-padding regions are
          # recreated explicitly so the private signing key never enters the repository.
          cat "$PUB"/rem00.bin >> "$APK"
          head -c 423 /dev/zero >> "$APK"
          cat "$PUB"/rem01.bin "$PUB"/rem02.bin "$PUB"/rem03.bin "$PUB"/rem04.bin "$PUB"/rem05.bin >> "$APK"
          head -c 2698 /dev/zero >> "$APK"
          cat "$PUB"/rem06.bin >> "$APK"

          test "$(stat -c%s "$APK")" = '37625'
          echo '2c12f365290b7f9c13478dae4c39c7309b70619bda2322f3d538868609347746  '"$APK" | sha256sum -c -
          unzip -t "$APK" >/dev/null

          printf '%s  %s\n' '2c12f365290b7f9c13478dae4c39c7309b70619bda2322f3d538868609347746' 'DisneyNOW-Fire-TV-v0.1-Build3-Permanent-Signed.apk' > "$OUTDIR/SHA256SUMS.txt"
          cat > "$OUTDIR/RELEASE-STATUS.txt" <<'EOF'
          DisneyNOW Fire TV Web Wrapper
          Version 0.1 Build 3
          Status: NOT DONE - COMPATIBILITY TEST
          Signing: permanent release signing identity established for Build 3 and future in-place updates.
          Physical Fire TV playback/cursor/zoom verification remains required before DONE.
          EOF

      - name: Commit permanent public APK archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DisneyNOWFireTV/Releases/v0.1-Build3-Compatibility-Test/
          if git diff --cached --quiet; then
            echo 'Archive already matches; nothing to commit.'
            exit 0
          fi
          git commit -m 'Archive DisneyNOW Fire TV v0.1 Build 3 permanent-signed compatibility test'
          git push origin HEAD:main
