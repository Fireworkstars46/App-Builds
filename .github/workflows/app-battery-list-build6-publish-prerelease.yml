name: App Battery List Build 6 - Publish Permanent Pre-release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-battery-list-build6-publish-prerelease.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG_NAME: 'app-battery-list-v1.0-build6'
      EXPECTED_ARTIFACT_ZIP_SHA256: '7dcae29cb19699f18fa681dc7760919fa8f2a800d1c52a26e3c8787607dfdc10'
      EXPECTED_APK_SHA256: '0a92077ce5fa011aa015fab270efb99c7fd32c3eaeb690000929d1d14463b3ca'
      EXPECTED_SOURCE_ZIP_SHA256: '3be1bccfd187680cea7d9c8371fd4e4016ec1107cbb92a70b7edb859709d4028'
      ARTIFACT_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-57c4-822f-859e-9f90ccd585b9/raw?se=2026-11-04T08%3A03%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=1b8ab51f-e38d-5622-9b91-e93fccf90cf9&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T02%3A27%3A07Z&ske=2026-11-05T02%3A27%3A07Z&sks=b&skv=2026-02-06&sig=rtI7k0XyELwkIwWqeu3cb9PSUrc9nnT%2BmVGoJ5E2US8%3D'

    steps:
      - name: Checkout archive repository
        uses: actions/checkout@v4

      - name: Download exact verified private release artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 "$ARTIFACT_URL" -o /tmp/build6-artifact.zip
          actual="$(sha256sum /tmp/build6-artifact.zip | awk '{print $1}')"
          echo "Artifact ZIP SHA-256: $actual"
          test "$actual" = "$EXPECTED_ARTIFACT_ZIP_SHA256"
          mkdir -p /tmp/build6-release
          unzip -q /tmp/build6-artifact.zip -d /tmp/build6-release

      - name: Verify signed APK, source and evidence before publication
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/build6-release
          test -s App-Battery-List-v1.0-Build-6.apk
          test -s App-Battery-List-v1.0-Build-6-Source.zip
          test -s App-Battery-List-v1.0-Build-6-APKSIGNER.txt
          test -s App-Battery-List-v1.0-Build-6-BADGING.txt
          test -s App-Battery-List-v1.0-Build-6-RELEASE-VERIFY.txt
          test "$(sha256sum App-Battery-List-v1.0-Build-6.apk | awk '{print $1}')" = "$EXPECTED_APK_SHA256"
          test "$(sha256sum App-Battery-List-v1.0-Build-6-Source.zip | awk '{print $1}')" = "$EXPECTED_SOURCE_ZIP_SHA256"
          grep -q 'PASS - Build 6 source manifest hashes verified' App-Battery-List-v1.0-Build-6-RELEASE-VERIFY.txt
          grep -q 'PASS - final APK permanent signing fingerprint checked using apksigner' App-Battery-List-v1.0-Build-6-RELEASE-VERIFY.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: bb7fd523c767327028075ff78b1d50d2b55b79571a3e4651c2bf23f2bb4f4393' App-Battery-List-v1.0-Build-6-APKSIGNER.txt
          grep -q "package: name='com.fireworkstars46.appbatterylist' versionCode='6' versionName='1.0'" App-Battery-List-v1.0-Build-6-BADGING.txt

      - name: Refuse tag/release overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Existing tag cannot be reused: $TAG_NAME" >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release cannot be reused: $TAG_NAME" >&2
            exit 1
          fi

      - name: Publish new permanent GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          # App Battery List v1.0 Build 6 — Permanent Signed Pre-release

          **New:** The All Settings Review now visits **Notifications first**, then the app's **App Info** page for relevant Battery, Permissions and Mobile data settings. **Important Only** skips apps/pages without general actionable suggestions; **Review All** is still available for inspecting every enabled user app. Old Build 5 sessions retain the previous order until restarted.

          - Package: `com.fireworkstars46.appbatterylist`
          - versionName: `1.0`; versionCode/Build: `6`
          - Permanent signer SHA-256: `BB:7F:D5:23:C7:67:32:70:28:07:5F:F7:8B:1D:50:D2:B5:5B:79:57:1A:3E:46:51:C2:BF:23:F2:BB:4F:43:93`
          - Signed APK SHA-256: `0a92077ce5fa011aa015fab270efb99c7fd32c3eaeb690000929d1d14463b3ca`
          - Source ZIP SHA-256: `3be1bccfd187680cea7d9c8371fd4e4016ec1107cbb92a70b7edb859709d4028`
          - Local isolated production-path Java tests: **61 PASS (18 legacy + 43 new)**
          - Exact source reconstruction/file hashes: **PASS**
          - Permanent signing backup/recovery gate, identity check, Android release compile, APK metadata/signature check: **PASS**
          - Release assets verified by independent download-back: publication workflow checks.

          This app does **not** read the current battery/notification/permission settings for other apps, change settings automatically, use Accessibility automation, or use hidden Samsung APIs. It navigates to supported Settings screens and counts *page visits*, not settings changes. Battery, Permissions and Mobile data must be opened manually from App Info when relevant; no supported arbitrary per-app direct Battery deep link exists.

          **PRE-RELEASE / NOT DONE:** Physical Galaxy S22 Notifications/App Info navigation, device Safe Self-Test, Secure Folder and real export/share are NOT TESTED. Do not mark DONE without on-device verification. Original Builds 1–5 remain immutable.
          EOF
          cd /tmp/build6-release
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'App Battery List v1.0 Build 6 — Permanent Signed Pre-release' \
            --notes-file /tmp/release-notes.md \
            --prerelease \
            App-Battery-List-v1.0-Build-6.apk \
            App-Battery-List-v1.0-Build-6-Source.zip \
            App-Battery-List-v1.0-Build-6.apk.sha256 \
            App-Battery-List-v1.0-Build-6-Source.zip.sha256 \
            App-Battery-List-v1.0-Build-6-APKSIGNER.txt \
            App-Battery-List-v1.0-Build-6-BADGING.txt \
            App-Battery-List-v1.0-Build-6-RELEASE-VERIFY.txt

      - name: Verify released assets are permanently retrievable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/redownload
          cd /tmp/redownload
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'App-Battery-List-v1.0-Build-6.apk'
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'App-Battery-List-v1.0-Build-6-Source.zip'
          test "$(sha256sum App-Battery-List-v1.0-Build-6.apk | awk '{print $1}')" = "$EXPECTED_APK_SHA256"
          test "$(sha256sum App-Battery-List-v1.0-Build-6-Source.zip | awk '{print $1}')" = "$EXPECTED_SOURCE_ZIP_SHA256"
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease == true' | grep -q true