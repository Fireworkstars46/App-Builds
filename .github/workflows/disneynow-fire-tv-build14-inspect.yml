name: Inspect DisneyNOW Fire TV Build 13 lag paths

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disneynow-fire-tv-build14-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reconstruct Build 13 and persist lag-sensitive source snapshot
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=_inspect13/DisneyNOWFireTV/Source
          mkdir -p _inspect13/DisneyNOWFireTV DisneyNOWFireTV/Build14
          python3 DisneyNOWFireTV/SourceSeed/reconstruct.py --output "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build2/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build4/reconstruct_build3.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build4/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build5/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build6/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build7/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build8/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build9/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build10/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build11/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build13/apply.py --source "$PROJECT_DIR"
          MAIN="$PROJECT_DIR/app/src/main/java/com/fireworkstars46/disneynowfiretv/MainActivity.java"
          cp "$MAIN" DisneyNOWFireTV/Build14/_inspect_MainActivity_Build13.java
          cp "$PROJECT_DIR/tools/static_audit.py" DisneyNOWFireTV/Build14/_inspect_static_audit_Build13.py
          cp "$PROJECT_DIR/app/build.gradle" DisneyNOWFireTV/Build14/_inspect_build_gradle_Build13.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DisneyNOWFireTV/Build14/_inspect_MainActivity_Build13.java DisneyNOWFireTV/Build14/_inspect_static_audit_Build13.py DisneyNOWFireTV/Build14/_inspect_build_gradle_Build13.txt
          git commit -m 'Temporary Build 14 source inspection snapshot'
          git push
