name: DisneyNOW Fire TV Build 4 - Publish verified signed APK

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Trigger DisneyNOW Build 4 publication'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact signed Build 4 staging APK
        shell: bash
        run: |
          set -euo pipefail
          out='DisneyNOWFireTV/Releases/v0.1-Build4-Compatibility-Test/DisneyNOW-Fire-TV-v0.1-Build4-Permanent-Signed.apk'
          mkdir -p "$(dirname "$out")"
          curl --fail --location --retry 2 --output "$out" 'https://uc1a36167028bd2135a9a6454513.dl.dropboxusercontent.com/cd/0/get/DKbKGPEb35MZmeArlYgfTOqaYLjY0W5fxsCrWoAcknHJc9rc4fzT1t-RbxE6xQxpB70xkaz5FiIyqd0aXVRw1oxPT2pABzv2HoT_IRM0QGJ3Sv2BoCvLBy7aZl3YaE5ff3QwTwG8OLnSVukwDrmwd72pzAwTSqjm-daEDkKqPzy4Xg/file?c_luid=f3fd60e5'
          echo 'd96d05ef24888b5542cc5bca4a1c4e1a6983a18f24f26345bb09fe85b2c773b6  '"$out" | sha256sum -c -
          unzip -t "$out"

      - name: Verify Android package, versionCode, and permanent signing identity
        shell: bash
        run: |
          set -euo pipefail
          apk='DisneyNOWFireTV/Releases/v0.1-Build4-Compatibility-Test/DisneyNOW-Fire-TV-v0.1-Build4-Permanent-Signed.apk'
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$apk" | tee /tmp/apksigner.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          grep -Eqi 'certificate SHA-256 digest: 2f4b3c694fc2865668d604fe5542f6cb183f1a1487908e873c98fca34c0fd838' /tmp/apksigner.txt
          "$AAPT" dump badging "$apk" | tee /tmp/badging.txt
          grep -q "package: name='com.fireworkstars46.disneynowfiretv'" /tmp/badging.txt
          grep -q "versionCode='4'" /tmp/badging.txt
          grep -q "versionName='0.1'" /tmp/badging.txt

      - name: Record published APK checksum
        shell: bash
        run: |
          set -euo pipefail
          apk='DisneyNOWFireTV/Releases/v0.1-Build4-Compatibility-Test/DisneyNOW-Fire-TV-v0.1-Build4-Permanent-Signed.apk'
          sha256sum "$apk" > DisneyNOWFireTV/Releases/v0.1-Build4-Compatibility-Test/SHA256SUMS.txt

      - name: Commit verified APK to release archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DisneyNOWFireTV/Releases/v0.1-Build4-Compatibility-Test/DisneyNOW-Fire-TV-v0.1-Build4-Permanent-Signed.apk \
                  DisneyNOWFireTV/Releases/v0.1-Build4-Compatibility-Test/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Release APK already published identically.'
          else
            git commit -m 'Publish verified DisneyNOW Fire TV v0.1 Build 4 APK'
            git push origin HEAD:main
          fi
