name: App Battery List Build 2 - Publish Permanent Pre-release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-battery-list-build2-publish-prerelease.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG_NAME: app-battery-list-v1.0-build2
      APK_NAME: App-Battery-List-v1.0-Build-2.apk
      EXPECTED_APK_SHA256: cc3e5a4ec1c01151e567a649584d76b67026e0e5450ba22bb9468fdd58d77a85
      EXPECTED_PACKAGE_ID: com.fireworkstars46.appbatterylist
      EXPECTED_VERSION_NAME: '1.0'
      EXPECTED_VERSION_CODE: '2'
      EXPECTED_CERT_SHA256: BB:7F:D5:23:C7:67:32:70:28:07:5F:F7:8B:1D:50:D2:B5:5B:79:57:1A:3E:46:51:C2:BF:23:F2:BB:4F:43:93
      STAGING_URL: 'https://uc88ed3bd635682c3ac4caef6075.dl.dropboxusercontent.com/cd/0/get/DLNDgE3KoFKw0Rjvqa_mD0HSgkzva6ZxSOMEVj-JkJFMdIw_tRd_ffQNCT7Vg-GI_S9U4yhxM3cK5iPVEni4SkTk4mZVGXoj75oesNfQHjhN5Y_n2EbMRsQFNiOKYt92mCDoX4TRoGNICAYAz7o7f-ShiHLVXoUlFe2JbZ2hhzn1Pg/file?c_luid=f3fd60e5'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout archive repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;36.0.0'

      - name: Download exact permanent signed APK and verify identity
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/$APK_NAME"
          curl --fail --location --retry 3 --output "$OUT" "$STAGING_URL"
          test -s "$OUT"
          actual_sha="$(sha256sum "$OUT" | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_APK_SHA256"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$OUT" | tee "$RUNNER_TEMP/BADGING.txt"
          grep -q "package: name='$EXPECTED_PACKAGE_ID'" "$RUNNER_TEMP/BADGING.txt"
          grep -q "versionCode='$EXPECTED_VERSION_CODE'" "$RUNNER_TEMP/BADGING.txt"
          grep -q "versionName='$EXPECTED_VERSION_NAME'" "$RUNNER_TEMP/BADGING.txt"

          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee "$RUNNER_TEMP/APKSIGNER-VERIFY.txt"
          actual_cert="$(grep -i 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/APKSIGNER-VERIFY.txt" | head -1 | sed 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected_cert="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual_cert" = "$expected_cert"

          printf '%s  %s\n' "$EXPECTED_APK_SHA256" "$APK_NAME" > "$RUNNER_TEMP/$APK_NAME.sha256"
          {
            echo '# App Battery List v1.0 Build 2 — Permanent Signed Pre-release'
            echo
            echo 'This is the permanent-signing candidate for App Battery List v1.0 Build 2.'
            echo
            echo '- Package: `com.fireworkstars46.appbatterylist`'
            echo '- versionName: `1.0`'
            echo '- versionCode / Build: `2`'
            echo '- Permanent signer SHA-256: `BB:7F:D5:23:C7:67:32:70:28:07:5F:F7:8B:1D:50:D2:B5:5B:79:57:1A:3E:46:51:C2:BF:23:F2:BB:4F:43:93`'
            echo '- APK SHA-256: `cc3e5a4ec1c01151e567a649584d76b67026e0e5450ba22bb9468fdd58d77a85`'
            echo '- Durable signing backup + real recovery test: **PASS**'
            echo '- Release compile/package/signature verification: **PASS**'
            echo
            echo '## Current validation status'
            echo 'Physical Galaxy S22 Guided Review round-trip: **NOT TESTED**.'
            echo 'Secure Folder runtime: **NOT TESTED**.'
            echo 'Safe Self-Test on the physical Galaxy S22: **NOT TESTED**.'
            echo
            echo 'Therefore this GitHub release is intentionally marked **Pre-release / NOT DONE** until the remaining on-device checks are completed. The APK bytes must not be silently replaced under this Build/tag.'
          } > "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Refuse historical tag/release reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing overwrite." >&2
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q .; then
            echo "Tag $TAG_NAME already exists; refusing reuse." >&2
            exit 1
          fi

      - name: Publish permanent GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            "$RUNNER_TEMP/$APK_NAME" \
            "$RUNNER_TEMP/$APK_NAME.sha256" \
            "$RUNNER_TEMP/APKSIGNER-VERIFY.txt" \
            "$RUNNER_TEMP/BADGING.txt" \
            --target "$GITHUB_SHA" \
            --title 'App Battery List v1.0 Build 2 — Permanent Signed Pre-release' \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" \
            --prerelease

      - name: Verify permanent release asset is retrievable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recheck"
          gh release download "$TAG_NAME" --pattern "$APK_NAME" --dir "$RUNNER_TEMP/recheck"
          re_sha="$(sha256sum "$RUNNER_TEMP/recheck/$APK_NAME" | awk '{print $1}')"
          test "$re_sha" = "$EXPECTED_APK_SHA256"
          echo "PASS - permanent GitHub release APK re-download SHA-256 matched: $re_sha"
