name: App Battery List Build 5 - Publish Permanent Pre-release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-battery-list-build5-publish-prerelease.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG_NAME: 'app-battery-list-v1.0-build5'
      EXPECTED_ARTIFACT_ZIP_SHA256: '0c0a4e3d7ada4c44bd754ecee5fff82069004a2dafc16e6b30b83eb1679e717a'
      EXPECTED_APK_SHA256: '2f248417e655d6f249ff7415c3940212f838beebd80b18e5254e8a83aa24b63a'
      EXPECTED_SOURCE_ZIP_SHA256: 'd5a422e118ad25d7a5b15101df155f985cc3887de02bb7b724514aa335eeeef2'
      ARTIFACT_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-18dc-822f-a615-d41221e63204/raw?se=2026-11-04T07%3A40%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=da2efeef-f7c5-5745-a7a9-08c90bd4a5ac&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T02%3A21%3A44Z&ske=2026-11-05T02%3A21%3A44Z&sks=b&skv=2026-02-06&sig=0bXhd7AeIbyYSkfMU%2BDuiMZ9Bna3GYA3vVIhbi7gR/w%3D'

    steps:
      - name: Checkout archive repository
        uses: actions/checkout@v4

      - name: Download exact verified private release artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 "$ARTIFACT_URL" -o /tmp/build5-artifact.zip
          actual="$(sha256sum /tmp/build5-artifact.zip | awk '{print $1}')"
          echo "Artifact ZIP SHA-256: $actual"
          test "$actual" = "$EXPECTED_ARTIFACT_ZIP_SHA256"
          mkdir -p /tmp/build5-release
          unzip -q /tmp/build5-artifact.zip -d /tmp/build5-release

      - name: Verify signed APK, source and evidence before publication
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/build5-release
          test -s App-Battery-List-v1.0-Build-5.apk
          test -s App-Battery-List-v1.0-Build-5-Source.zip
          test -s App-Battery-List-v1.0-Build-5-APKSIGNER.txt
          test -s App-Battery-List-v1.0-Build-5-BADGING.txt
          test -s App-Battery-List-v1.0-Build-5-RELEASE-VERIFY.txt
          test "$(sha256sum App-Battery-List-v1.0-Build-5.apk | awk '{print $1}')" = "$EXPECTED_APK_SHA256"
          test "$(sha256sum App-Battery-List-v1.0-Build-5-Source.zip | awk '{print $1}')" = "$EXPECTED_SOURCE_ZIP_SHA256"
          grep -q 'PASS - Build 5 source manifest hashes verified' App-Battery-List-v1.0-Build-5-RELEASE-VERIFY.txt
          grep -q 'PASS - final APK permanent signing fingerprint checked using apksigner' App-Battery-List-v1.0-Build-5-RELEASE-VERIFY.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: bb7fd523c767327028075ff78b1d50d2b55b79571a3e4651c2bf23f2bb4f4393' App-Battery-List-v1.0-Build-5-APKSIGNER.txt
          grep -q "package: name='com.fireworkstars46.appbatterylist' versionCode='5' versionName='1.0'" App-Battery-List-v1.0-Build-5-BADGING.txt

      - name: Refuse tag/release overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Existing tag cannot be reused: $TAG_NAME" >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release cannot be reused: $TAG_NAME" >&2
            exit 1
          fi

      - name: Publish new permanent GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          # App Battery List v1.0 Build 5 — Permanent Signed Pre-release

          This version adds the requested **All Settings Review** mode.

          - Package ID: `com.fireworkstars46.appbatterylist`
          - VersionName: `1.0`
          - VersionCode / Build: `5`
          - Permanent signer SHA-256: `BB:7F:D5:23:C7:67:32:70:28:07:5F:F7:8B:1D:50:D2:B5:5B:79:57:1A:3E:46:51:C2:BF:23:F2:BB:4F:43:93`
          - Signed APK SHA-256: `2f248417e655d6f249ff7415c3940212f838beebd80b18e5254e8a83aa24b63a`
          - Exact reconstructed source ZIP SHA-256: `d5a422e118ad25d7a5b15101df155f985cc3887de02bb7b724514aa335eeeef2`
          - Durable signing backup and real recovery test: **PASS**
          - Source reconstruction/file hashes: **PASS**
          - Android release compile, permanent signing identity, package/version checks: **PASS**

          **How to use:** Open **All Settings Review**. For each enabled user app, the first Settings visit is App Info, where you manually review Battery, Permissions, and Mobile data. After you return, the next visit opens that app's Notifications page directly. Returning again advances to the next app. **Open Current Step / Next Step / Previous Step / Skip App / End Review** provide manual control. Current-app recommendations are shown in the app.

          **Limit:** App Battery List cannot directly change another app's protected settings, and does not use Accessibility or hidden Samsung APIs to simulate taps. The automatic part is **navigation only**. Returning counts a page as visited, not confirmation a change was made.

          All original Build 3 Guided Review and app list/export functionality remains. The Android application ID and permanent signing certificate remain the same for an in-place update. Samsung Secure Folder is still separate.

          **Build history:** Build 4 was an unreleased failed-compile source candidate, preserved as such in the archive. The compile correction is released under Build 5; no Build 4 APK exists.

          **Validation pending / NOT DONE:** Physical Galaxy S22 All Settings Review App Info/Notifications auto-navigation, device Safe Self-Test, Secure Folder behavior, and interactive export/share remain **NOT TESTED**. This is intentionally a **pre-release** until device checks are completed.
          EOF
          cd /tmp/build5-release
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'App Battery List v1.0 Build 5 — Permanent Signed Pre-release' \
            --notes-file /tmp/release-notes.md \
            --prerelease \
            App-Battery-List-v1.0-Build-5.apk \
            App-Battery-List-v1.0-Build-5-Source.zip \
            App-Battery-List-v1.0-Build-5.apk.sha256 \
            App-Battery-List-v1.0-Build-5-Source.zip.sha256 \
            App-Battery-List-v1.0-Build-5-APKSIGNER.txt \
            App-Battery-List-v1.0-Build-5-BADGING.txt \
            App-Battery-List-v1.0-Build-5-RELEASE-VERIFY.txt

      - name: Verify released assets are permanently retrievable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/redownload
          cd /tmp/redownload
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'App-Battery-List-v1.0-Build-5.apk'
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'App-Battery-List-v1.0-Build-5-Source.zip'
          test "$(sha256sum App-Battery-List-v1.0-Build-5.apk | awk '{print $1}')" = "$EXPECTED_APK_SHA256"
          test "$(sha256sum App-Battery-List-v1.0-Build-5-Source.zip | awk '{print $1}')" = "$EXPECTED_SOURCE_ZIP_SHA256"
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease == true' | grep -q true