name: Build RitschyMirror English installer

on:
  push:
    paths:
      - 'RitschyMirror/Source/**'
      - '.github/workflows/build-ritschy-mirror.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out App-Builds
        uses: actions/checkout@v4

      - name: Check out the exact RitschyMirror 1.3.2 source
        uses: actions/checkout@v4
        with:
          repository: RitschyRigz/ritschy-mirror
          ref: d9ca2cf61fe4b8a07a7cf171480473ae09fcd5c8
          path: _upstream/ritschy-mirror

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Translate the UI into English
        shell: pwsh
        env:
          RITSCHY_SOURCE: _upstream/ritschy-mirror
        run: |
          python RitschyMirror/Source/translate.py
          if ($LASTEXITCODE -ne 0) { throw "Translation failed" }

      - name: Enable alternate full-monitor capture for unsupported DXGI systems
        shell: pwsh
        env:
          RITSCHY_SOURCE: _upstream/ritschy-mirror
        run: |
          python RitschyMirror/Source/enable_monitor_fallback.py
          if ($LASTEXITCODE -ne 0) { throw "Monitor fallback patch failed" }

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build a standalone Windows x64 application
        shell: pwsh
        run: |
          dotnet publish _upstream/ritschy-mirror/MirrorTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o _upstream/ritschy-mirror/EnglishBuild
          if ($LASTEXITCODE -ne 0) { throw "Windows app compilation failed" }
          if (!(Test-Path '_upstream/ritschy-mirror/EnglishBuild/RitschyMirror.exe')) { throw "App executable was not generated" }

      - name: Install Inno Setup compiler when needed
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }

      - name: Package the English setup EXE
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc 'RitschyMirror/Source/RitschyMirror-English.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          if (!(Test-Path '_upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2.exe')) { throw 'Setup EXE not generated' }
          Rename-Item '_upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2.exe' 'RitschyMirror-English-Setup-1.3.2-CaptureFix1.exe'
          if (!(Test-Path '_upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2-CaptureFix1.exe')) { throw 'Capture fix setup not generated' }

      - name: Upload finished installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RitschyMirror-English-Setup-1.3.2-CaptureFix1
          path: _upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2-CaptureFix1.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish direct EXE download on GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = '_upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2-CaptureFix1.exe'
          $tag = 'ritschymirror-english-1.3.2-capturefix1'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber
          } else {
            gh release create $tag $file --target $env:GITHUB_SHA --title 'RitschyMirror 1.3.2 English — Capture Fix 1 (unofficial)' --notes 'Adds an automatic Windows Graphics Capture (whole-monitor) fallback when DXGI DuplicateOutput1 reports DXGI_ERROR_UNSUPPORTED. Keeps the original English UI, monitor selection and windowed mode. This Windows build was compiled and packaged automatically; the workaround has not yet been tested on the affected laptop.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; the setup remains available under Actions artifacts.' }
