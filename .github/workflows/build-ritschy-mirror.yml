name: Build RitschyMirror English installer

on:
  push:
    paths:
      - 'RitschyMirror/Source/**'
      - '.github/workflows/build-ritschy-mirror.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out App-Builds
        uses: actions/checkout@v4

      - name: Check out the exact RitschyMirror 1.3.2 source
        uses: actions/checkout@v4
        with:
          repository: RitschyRigz/ritschy-mirror
          ref: d9ca2cf61fe4b8a07a7cf171480473ae09fcd5c8
          path: _upstream/ritschy-mirror

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Translate the UI into English
        shell: pwsh
        env:
          RITSCHY_SOURCE: _upstream/ritschy-mirror
        run: |
          python RitschyMirror/Source/translate.py
          if ($LASTEXITCODE -ne 0) { throw "Translation failed" }

      - name: Enable alternate full-monitor capture for unsupported DXGI systems
        shell: pwsh
        env:
          RITSCHY_SOURCE: _upstream/ritschy-mirror
        run: |
          python RitschyMirror/Source/enable_monitor_fallback.py
          if ($LASTEXITCODE -ne 0) { throw "Monitor fallback patch failed" }

      - name: Add color-neutral 8-bit SDR copy mode
        shell: pwsh
        env:
          RITSCHY_SOURCE: _upstream/ritschy-mirror
        run: |
          python RitschyMirror/Source/add_copy_mode.py
          if ($LASTEXITCODE -ne 0) { throw "Copy-mode patch failed" }

      - name: Improve smooth dragging, FPS and low-latency capture
        shell: pwsh
        env:
          RITSCHY_SOURCE: _upstream/ritschy-mirror
        run: |
          python RitschyMirror/Source/smooth_drag_and_fps.py
          if ($LASTEXITCODE -ne 0) { throw "Smooth drag and FPS patch failed" }

      - name: Add remembered window size, maximization and live resizing
        shell: pwsh
        env:
          RITSCHY_SOURCE: _upstream/ritschy-mirror
        run: |
          python RitschyMirror/Source/persistent_resizable_preview.py
          if ($LASTEXITCODE -ne 0) { throw "Resizable preview patch failed" }

      - name: Add preview startup display selector
        shell: pwsh
        env:
          RITSCHY_SOURCE: _upstream/ritschy-mirror
        run: |
          python RitschyMirror/Source/preview_start_display.py
          if ($LASTEXITCODE -ne 0) { throw "Preview start display patch failed" }

      - name: Add optional automatic clarity and screen-edge confinement
        shell: pwsh
        env:
          RITSCHY_SOURCE: _upstream/ritschy-mirror
        run: |
          python RitschyMirror/Source/auto_clarity_and_window_edges.py
          if ($LASTEXITCODE -ne 0) { throw "Automatic clarity and screen edge patch failed" }

      - name: Add debug logs for freeze and recursive mirroring
        shell: pwsh
        env:
          RITSCHY_SOURCE: _upstream/ritschy-mirror
        run: |
          python RitschyMirror/Source/debug_capture_freezes.py
          if ($LASTEXITCODE -ne 0) { throw "Debug diagnostics patch failed" }

      - name: Fix shader buffer size and recursive preview startup
        shell: pwsh
        env:
          RITSCHY_SOURCE: _upstream/ritschy-mirror
        run: |
          python RitschyMirror/Source/fix_debug_startup.py
          if ($LASTEXITCODE -ne 0) { throw "Startup crash and recursive preview fix failed" }

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build a standalone Windows x64 application
        shell: pwsh
        run: |
          dotnet publish _upstream/ritschy-mirror/MirrorTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o _upstream/ritschy-mirror/EnglishBuild
          if ($LASTEXITCODE -ne 0) { throw "Windows app compilation failed" }
          if (!(Test-Path '_upstream/ritschy-mirror/EnglishBuild/RitschyMirror.exe')) { throw "App executable was not generated" }

      - name: Install Inno Setup compiler when needed
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }

      - name: Package the English setup EXE
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc 'RitschyMirror/Source/RitschyMirror-English.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          if (!(Test-Path '_upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2.exe')) { throw 'Setup EXE not generated' }
          Rename-Item '_upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2.exe' 'RitschyMirror-English-Setup-1.3.2-DebugFix1.exe'
          if (!(Test-Path '_upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2-DebugFix1.exe')) { throw 'DebugFix installer setup not generated' }

      - name: Upload finished installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RitschyMirror-English-Setup-1.3.2-DebugFix1
          path: _upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2-DebugFix1.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish direct EXE download on GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = '_upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2-DebugFix1.exe'
          $tag = 'ritschymirror-english-1.3.2-debugfix1'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber
          } else {
            gh release create $tag $file --target $env:GITHUB_SHA --title 'RitschyMirror 1.3.2 English — Debug Fix 1 (unofficial)' --notes 'Fixes Direct3D 11 invalid constant-buffer size (72 versus required 16-byte multiple) introduced in Auto Clarity; prevents recursive main-screen preview by automatically placing it on the HDMI target when it would overlap the captured source. Retains all Debug 1 instrumentation and earlier features. Windows compilation and packaging only; live performance requires user testing.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; the setup remains available under Actions artifacts.' }
