name: Build RitschyMirror English installer

on:
  push:
    branches: [main]
    paths:
      - 'RitschyMirror/Source/**'
      - '.github/workflows/build-ritschy-mirror.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      RITSCHY_SOURCE: _upstream/ritschy-mirror
      RITSCHY_INSTALLER: RitschyMirror/Source/RitschyMirror-English.iss
      RITSCHY_WORKFLOW: .github/workflows/build-ritschy-mirror.yml
      MASTER_RULES_PATH: MASTER_RULES.md

    steps:
      - name: Check out App-Builds
        uses: actions/checkout@v4

      - name: Check out exact RitschyMirror 1.3.2 upstream source
        uses: actions/checkout@v4
        with:
          repository: RitschyRigz/ritschy-mirror
          ref: d9ca2cf61fe4b8a07a7cf171480473ae09fcd5c8
          path: _upstream/ritschy-mirror

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply established Build 2 behavior patches in exact order
        shell: pwsh
        run: |
          $patches = @(
            'translate.py',
            'enable_monitor_fallback.py',
            'add_copy_mode.py',
            'smooth_drag_and_fps.py',
            'persistent_resizable_preview.py',
            'preview_start_display.py',
            'auto_clarity_and_window_edges.py',
            'debug_capture_freezes.py',
            'fix_debug_startup.py',
            'native_window_main_preview.py',
            'lightshot_capture_toggle.py',
            'recursive_projector_mode.py',
            'live_browser_snap_restore.py',
            'live_top_edge_bounce.py',
            'fix_tall_window_vertical_drag.py',
            'resize_screen_bounds_only.py',
            'native_live_ui_thread.py',
            'native_live_drag_resize_v2.py',
            'obs_style_native_video_surface.py',
            'obs_live_viewport_reflow.py',
            'preview_to_existing_tray.py',
            'visible_extended_preview_tray.py',
            'visible_tray_shortcut.py',
            'fix_taskbar_shortcut_persistence.py',
            'sync_tray_main_settings.py',
            'optional_minimize_to_tray_preview_menu.py',
            'optional_main_settings_minimize_to_tray.py',
            'x_closes_entire_app_both_windows.py',
            'fix_main_settings_tray_restore.py',
            'preview_x_stops_mirroring_only.py',
            'tray_two_double_click_preview.py',
            'fix_tray_double_click_stopped_preview.py'
          )
          foreach ($patch in $patches) {
            Write-Host "Applying $patch"
            python "RitschyMirror/Source/$patch"
            if ($LASTEXITCODE -ne 0) { throw "Established patch failed: $patch" }
          }

      - name: Apply completed Build 3 patch set
        shell: pwsh
        run: |
          python RitschyMirror/Source/current_instructions_build3.py
          if ($LASTEXITCODE -ne 0) { throw "Build 3 patch set failed" }

      - name: Apply Build 4 MASTER_RULES corrective patches
        shell: pwsh
        run: |
          python RitschyMirror/Source/master_rules_build4_core_types.py
          if ($LASTEXITCODE -ne 0) { throw "Build 4 core helper-types patch failed" }
          python RitschyMirror/Source/master_rules_build4_core_patch.py
          if ($LASTEXITCODE -ne 0) { throw "Build 4 core source patch failed" }
          python RitschyMirror/Source/master_rules_build4_selftest.py
          if ($LASTEXITCODE -ne 0) { throw "Build 4 Safe Self-Test patch failed" }
          python RitschyMirror/Source/master_rules_build4_layout.py
          if ($LASTEXITCODE -ne 0) { throw "Build 4 layout/persistence patch failed" }
          python RitschyMirror/Source/master_rules_build4_controls.py
          if ($LASTEXITCODE -ne 0) { throw "Build 4 control/close regression patch failed" }
          python RitschyMirror/Source/master_rules_build4_controls2.py
          if ($LASTEXITCODE -ne 0) { throw "Build 4 Settings-control regression patch failed" }

      - name: Run least-privilege AV and isolation static audit
        shell: pwsh
        env:
          RITSCHY_AUDIT_REPORT: _upstream/ritschy-mirror/RELIABILITY-AV-SAFETY-AUDIT.txt
        run: |
          python RitschyMirror/Source/reliability_av_safety.py
          if ($LASTEXITCODE -ne 0) { throw "Reliability / AV-safety audit failed" }

      - name: Run current MASTER_RULES static audit
        shell: pwsh
        env:
          RITSCHY_BUILD4_AUDIT_REPORT: _upstream/ritschy-mirror/BUILD4-MASTER-RULES-AUDIT.txt
        run: |
          python RitschyMirror/Source/build4_master_rules_audit.py
          if ($LASTEXITCODE -ne 0) { throw "Build 4 current MASTER_RULES static audit failed" }
          $audit = Get-Content '_upstream/ritschy-mirror/BUILD4-MASTER-RULES-AUDIT.txt' -Raw
          if ($audit -notmatch 'STATIC TOTAL: PASS=\d+ FAIL=0 N/A=\d+') { throw 'Static audit did not report FAIL=0' }
          if ($audit -notmatch 'RESULT: PASS') { throw 'Static audit did not report PASS' }

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Compile with warnings treated as errors
        shell: pwsh
        run: |
          dotnet build _upstream/ritschy-mirror/MirrorTool.csproj -c Release -r win-x64 -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw "Compiler/static validation failed" }

      - name: Publish private self-contained Windows x64 application
        shell: pwsh
        run: |
          dotnet publish _upstream/ritschy-mirror/MirrorTool.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=false -p:PublishTrimmed=false -p:TreatWarningsAsErrors=true -o _upstream/ritschy-mirror/EnglishBuild
          if ($LASTEXITCODE -ne 0) { throw "Windows application publish failed" }
          if (!(Test-Path '_upstream/ritschy-mirror/EnglishBuild/RitschyMirror.exe')) { throw "Application EXE was not generated" }
          Remove-Item '_upstream/ritschy-mirror/EnglishBuild/mirror_config.json' -Force -ErrorAction SilentlyContinue
          Remove-Item '_upstream/ritschy-mirror/EnglishBuild/app_settings.json' -Force -ErrorAction SilentlyContinue
          Get-ChildItem '_upstream/ritschy-mirror/EnglishBuild' -Filter '*.pdb' -Recurse | Remove-Item -Force
          if (!(Test-Path '_upstream/ritschy-mirror/EnglishBuild/coreclr.dll')) { throw "Private self-contained runtime files missing" }
          if (Test-Path '_upstream/ritschy-mirror/EnglishBuild/mirror_config.json') { throw "Publish output must not contain user config" }

      - name: Package final patched source
        shell: pwsh
        run: |
          $stage = '_source-package'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Get-ChildItem '_upstream/ritschy-mirror' -Force | Where-Object {
            $_.Name -notin @('.git','bin','obj','EnglishBuild','EnglishInstaller','install.ps1','publish.ps1')
          } | ForEach-Object { Copy-Item $_.FullName $stage -Recurse -Force }
          @'
          RitschyMirror 1.3.2 English - Build 4
          Corrective build for the current MASTER_RULES.md.
          Preserves established project identity, install/data/settings/log paths,
          rendering/tray behavior, and in-place update compatibility. Adds only
          required reliability/regression coverage and backward-compatible state.
          '@ | Set-Content (Join-Path $stage 'BUILD-NOTES.txt') -Encoding UTF8
          Compress-Archive -Path "$stage\*" -DestinationPath 'RitschyMirror-1.3.2-Build4-MasterRules-Source.zip' -CompressionLevel Optimal
          if (!(Test-Path 'RitschyMirror-1.3.2-Build4-MasterRules-Source.zip')) { throw 'Build 4 source ZIP not generated' }

      - name: Install Inno Setup compiler when needed
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }

      - name: Package Build 4 installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc 'RitschyMirror/Source/RitschyMirror-English.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $base = '_upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2.exe'
          $final = '_upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2-Build4-MasterRules.exe'
          if (!(Test-Path $base)) { throw 'Base setup EXE not generated' }
          Rename-Item $base (Split-Path $final -Leaf)
          if (!(Test-Path $final)) { throw 'Build 4 installer setup not generated' }

      - name: Verify Build 3 to Build 4 update, shortcuts, startup, Safe Self-Test and uninstall
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $appDir = Join-Path $env:LOCALAPPDATA 'Programs\RitschyMirror'
          $installer = (Resolve-Path '_upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2-Build4-MasterRules.exe').Path
          $programs = [Environment]::GetFolderPath('Programs')
          $desktop = [Environment]::GetFolderPath('Desktop')
          $mainShortcut = Join-Path $programs 'RitschyMirror\RitschyMirror.lnk'
          $settingsShortcut = Join-Path $programs 'RitschyMirror\RitschyMirror Settings.lnk'
          $desktopShortcut = Join-Path $desktop 'RitschyMirror.lnk'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'

          Remove-Item $appDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $programs 'RitschyMirror') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $desktopShortcut -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty $runKey -Name 'RitschyMirror' -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path '_previous-build' | Out-Null
          gh release download 'ritschymirror-english-1.3.2-build3-currentinstructions' --repo 'Fireworkstars46/App-Builds' --pattern 'RitschyMirror-English-Setup-1.3.2-Build3-CurrentInstructions.exe' --dir '_previous-build'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download completed Build 3 for real update test' }
          $build3 = (Resolve-Path '_previous-build/RitschyMirror-English-Setup-1.3.2-Build3-CurrentInstructions.exe').Path

          $oldInstall = Start-Process -FilePath $build3 -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=""') -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw "Build 3 baseline install failed: $($oldInstall.ExitCode)" }
          if (!(Test-Path (Join-Path $appDir 'RitschyMirror.exe'))) { throw 'Build 3 baseline EXE missing' }

          $mirrorSentinel = '{"audit_preserve":"mirror_config","build":3}'
          $appSentinel = '{"audit_preserve":"app_settings","build":3}'
          Set-Content (Join-Path $appDir 'mirror_config.json') $mirrorSentinel -NoNewline -Encoding UTF8
          Set-Content (Join-Path $appDir 'app_settings.json') $appSentinel -NoNewline -Encoding UTF8

          $update = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($update.ExitCode -ne 0) { throw "Build 3 -> Build 4 in-place update failed: $($update.ExitCode)" }
          if ((Get-Content (Join-Path $appDir 'mirror_config.json') -Raw) -ne $mirrorSentinel) { throw 'mirror_config.json changed during Build 3 -> Build 4 update' }
          if ((Get-Content (Join-Path $appDir 'app_settings.json') -Raw) -ne $appSentinel) { throw 'app_settings.json changed during Build 3 -> Build 4 update' }
          if (!(Test-Path (Join-Path $appDir 'RitschyMirror.exe'))) { throw 'Build 4 installed EXE missing' }
          if (!(Test-Path (Join-Path $appDir 'coreclr.dll'))) { throw 'Build 4 private runtime missing' }

          if (!(Test-Path $mainShortcut) -or !(Test-Path $settingsShortcut)) { throw 'Start Menu shortcuts missing' }
          $wsh = New-Object -ComObject WScript.Shell
          $mainLnk = $wsh.CreateShortcut($mainShortcut)
          $settingsLnk = $wsh.CreateShortcut($settingsShortcut)
          $expectedExe = Join-Path $appDir 'RitschyMirror.exe'
          if ($mainLnk.TargetPath -ne $expectedExe) { throw "Bad main shortcut target: $($mainLnk.TargetPath)" }
          if ($settingsLnk.TargetPath -ne $expectedExe -or $settingsLnk.Arguments -ne '--settings') { throw 'Bad Settings shortcut target/arguments' }
          if ([string]::IsNullOrWhiteSpace($mainLnk.IconLocation) -or [string]::IsNullOrWhiteSpace($settingsLnk.IconLocation)) { throw 'Shortcut icon path missing' }
          $runValue = (Get-ItemProperty $runKey -Name 'RitschyMirror' -ErrorAction SilentlyContinue).RitschyMirror
          if ($runValue) { throw 'Autostart unexpectedly enabled when Build 3 had it disabled' }

          $selfTestExe = Join-Path $appDir 'RitschyMirror.exe'
          $selfTest = Start-Process -FilePath $selfTestExe -ArgumentList '--safe-self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "Installed Safe Self-Test failed: $($selfTest.ExitCode)" }
          $selfTestReport = Join-Path $appDir 'Diagnostics\Safe-Self-Test-Last.txt'
          if (!(Test-Path $selfTestReport)) { throw 'Safe Self-Test report missing' }
          $selfText = Get-Content $selfTestReport -Raw
          if ($selfText -notmatch 'RESULT: PASS') { throw 'Safe Self-Test did not report PASS' }
          if ($selfText -notmatch 'TOTAL: PASS=\d+ FAIL=0 SKIPPED=\d+') { throw 'Safe Self-Test did not report FAIL=0 totals' }
          if ($selfText -notmatch 'Version: v1\.3\.2 Build 4') { throw 'Safe Self-Test did not run Build 4' }
          Copy-Item $selfTestReport 'RitschyMirror-1.3.2-Build4-Safe-Self-Test-CI.txt' -Force

          $taskInstall = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS="desktopicon,autostart"') -Wait -PassThru
          if ($taskInstall.ExitCode -ne 0) { throw "Optional shortcut/startup task install failed: $($taskInstall.ExitCode)" }
          if (!(Test-Path $desktopShortcut)) { throw 'Optional desktop shortcut not created' }
          $desktopLnk = $wsh.CreateShortcut($desktopShortcut)
          if ($desktopLnk.TargetPath -ne $expectedExe -or [string]::IsNullOrWhiteSpace($desktopLnk.IconLocation)) { throw 'Desktop shortcut target/icon invalid' }
          $runValue = (Get-ItemProperty $runKey -Name 'RitschyMirror' -ErrorAction Stop).RitschyMirror
          if ($runValue -notmatch [regex]::Escape($expectedExe)) { throw 'Optional startup value does not target installed EXE' }

          $preserveTasks = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($preserveTasks.ExitCode -ne 0) { throw "Task-preservation update failed: $($preserveTasks.ExitCode)" }
          if (!(Test-Path $desktopShortcut)) { throw 'Desktop shortcut choice was lost during update' }
          $runValue = (Get-ItemProperty $runKey -Name 'RitschyMirror' -ErrorAction Stop).RitschyMirror
          if ($runValue -notmatch [regex]::Escape($expectedExe)) { throw 'Startup choice was lost during update' }

          $uninstaller = Get-ChildItem $appDir -Filter 'unins*.exe' | Select-Object -First 1
          if (!$uninstaller) { throw 'Uninstaller missing' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall test failed: $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $expectedExe) { throw 'Uninstall left application executable behind' }
          if ((Test-Path $mainShortcut) -or (Test-Path $settingsShortcut) -or (Test-Path $desktopShortcut)) { throw 'Uninstall left shortcut behind' }
          if ((Get-ItemProperty $runKey -Name 'RitschyMirror' -ErrorAction SilentlyContinue).RitschyMirror) { throw 'Uninstall left RitschyMirror startup value behind' }
          if (!(Test-Path (Join-Path $appDir 'mirror_config.json'))) { throw 'Uninstall removed mirror_config.json user data' }
          if (!(Test-Path (Join-Path $appDir 'app_settings.json'))) { throw 'Uninstall removed app_settings.json user data' }
          if (!(Test-Path (Join-Path $appDir 'Diagnostics\Safe-Self-Test-Last.txt'))) { throw 'Uninstall removed diagnostic/self-test user data' }

          Remove-Item $appDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item '_previous-build' -Recurse -Force -ErrorAction SilentlyContinue

      - name: Create verification summary, audit copies and SHA-256 checksums
        shell: pwsh
        run: |
          Copy-Item '_upstream/ritschy-mirror/RELIABILITY-AV-SAFETY-AUDIT.txt' 'RitschyMirror-1.3.2-Build4-AV-Safety-Audit.txt'
          Copy-Item '_upstream/ritschy-mirror/BUILD4-MASTER-RULES-AUDIT.txt' 'RitschyMirror-1.3.2-Build4-MasterRules-Audit.txt'
          $staticText = Get-Content 'RitschyMirror-1.3.2-Build4-MasterRules-Audit.txt' -Raw
          $selfText = Get-Content 'RitschyMirror-1.3.2-Build4-Safe-Self-Test-CI.txt' -Raw
          $staticMatch = [regex]::Match($staticText, 'STATIC TOTAL: PASS=(\d+) FAIL=(\d+) N/A=(\d+)')
          $selfMatch = [regex]::Match($selfText, 'TOTAL: PASS=(\d+) FAIL=(\d+) SKIPPED=(\d+)')
          if (!$staticMatch.Success -or !$selfMatch.Success) { throw 'Could not parse verification totals' }
          @(
            'RitschyMirror 1.3.2 Build 4 verification summary'
            "Static: PASS=$($staticMatch.Groups[1].Value) FAIL=$($staticMatch.Groups[2].Value) N/A=$($staticMatch.Groups[3].Value)"
            "Safe Self-Test: PASS=$($selfMatch.Groups[1].Value) FAIL=$($selfMatch.Groups[2].Value) SKIPPED=$($selfMatch.Groups[3].Value)"
            'Compiler: 0 warnings required by TreatWarningsAsErrors; successful build means 0 errors.'
          ) | Set-Content 'RitschyMirror-1.3.2-Build4-Verification-Summary.txt' -Encoding UTF8

          $files = @(
            '_upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2-Build4-MasterRules.exe',
            'RitschyMirror-1.3.2-Build4-MasterRules-Source.zip',
            'RitschyMirror-1.3.2-Build4-AV-Safety-Audit.txt',
            'RitschyMirror-1.3.2-Build4-MasterRules-Audit.txt',
            'RitschyMirror-1.3.2-Build4-Safe-Self-Test-CI.txt',
            'RitschyMirror-1.3.2-Build4-Verification-Summary.txt'
          )
          $lines = foreach ($file in $files) {
            $h = Get-FileHash $file -Algorithm SHA256
            "$($h.Hash)  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content 'RitschyMirror-1.3.2-Build4-SHA256.txt' -Encoding ASCII

      - name: Upload Build 4 installer, source, audits and self-test
        uses: actions/upload-artifact@v4
        with:
          name: RitschyMirror-1.3.2-Build4-MasterRules
          path: |
            _upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2-Build4-MasterRules.exe
            RitschyMirror-1.3.2-Build4-MasterRules-Source.zip
            RitschyMirror-1.3.2-Build4-AV-Safety-Audit.txt
            RitschyMirror-1.3.2-Build4-MasterRules-Audit.txt
            RitschyMirror-1.3.2-Build4-Safe-Self-Test-CI.txt
            RitschyMirror-1.3.2-Build4-Verification-Summary.txt
            RitschyMirror-1.3.2-Build4-SHA256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish Build 4 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'ritschymirror-english-1.3.2-build4-masterrules'
          $assets = @(
            '_upstream/ritschy-mirror/EnglishInstaller/RitschyMirror-English-Setup-1.3.2-Build4-MasterRules.exe',
            'RitschyMirror-1.3.2-Build4-MasterRules-Source.zip',
            'RitschyMirror-1.3.2-Build4-AV-Safety-Audit.txt',
            'RitschyMirror-1.3.2-Build4-MasterRules-Audit.txt',
            'RitschyMirror-1.3.2-Build4-Safe-Self-Test-CI.txt',
            'RitschyMirror-1.3.2-Build4-Verification-Summary.txt',
            'RitschyMirror-1.3.2-Build4-SHA256.txt'
          )
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title 'RitschyMirror 1.3.2 English — Build 4 MASTER_RULES Corrective (unofficial)' --notes 'Corrective build required by the latest MASTER_RULES.md audit; no intentional mirroring/rendering feature change. Preserves AppId, install path, single-instance design, app_settings.json/mirror_config.json, logs/data, shortcuts, startup identity, tray/taskbar behavior, and Build 3 update compatibility. Fixes real audit gaps: verified atomic settings writes, early single-instance restore-signal race, single-vs-double tray-click arbitration, shared duplicate-setting production setters, remembered/off-screen-safe/resettable Settings window geometry, explicit close-decision path, and much broader production-path Safe Self-Test coverage with per-item PASS/FAIL/SKIPPED. Multi-instance stale-writer/runtime-mode rules are N/A because RitschyMirror intentionally remains single-instance. CI compiles with warnings as errors, performs a real Build 3 -> Build 4 in-place update with byte-exact config preservation, runs the installed Safe Self-Test, verifies shortcuts/startup choices, and verifies data-preserving uninstall. No AV exclusions are added. Real GPU/capture hardware, physical Explorer tray behavior, and SmartScreen/Bitdefender reputation remain manual/interactive.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Build 4 release publish failed' }
