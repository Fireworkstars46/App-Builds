name: Generate DisneyNOW Fire TV Build 14 lag fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disneynow-fire-tv-build14-generate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reconstruct Build 13 and generate deterministic Build 14 patch
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=_gen14/DisneyNOWFireTV/Source
          rm -rf _gen14 /tmp/build14-patch.zip
          mkdir -p _gen14/DisneyNOWFireTV DisneyNOWFireTV/Build14/patch_parts
          python3 DisneyNOWFireTV/SourceSeed/reconstruct.py --output "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build2/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build4/reconstruct_build3.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build4/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build5/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build6/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build7/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build8/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build9/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build10/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build11/apply.py --source "$PROJECT_DIR"
          python3 DisneyNOWFireTV/Build13/apply.py --source "$PROJECT_DIR"
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import hashlib, zipfile, base64, textwrap
          root=Path(__import__('sys').argv[1])
          mainp=root/'app/src/main/java/com/fireworkstars46/disneynowfiretv/MainActivity.java'
          gradlep=root/'app/build.gradle'
          infop=root/'BUILD_INFO.md'
          readmep=root/'README.md'
          auditp=root/'tools/static_audit.py'
          files=[mainp,gradlep,infop,readmep,auditp]
          rels=[str(p.relative_to(root)) for p in files]
          base={r:hashlib.sha256((root/r).read_bytes()).hexdigest() for r in rels}

          main=mainp.read_text()
          def once(old,new,label):
              global main
              c=main.count(old)
              if c!=1: raise SystemExit(f'{label}: expected 1 occurrence, got {c}')
              main=main.replace(old,new)

          once('    private static final boolean AUTO_NATIVE_HANDOFF_ENABLED = false;\n    private static final long AUTO_NATIVE_FALLBACK_TIMEOUT_MS = 20000L;',
               '    private static final boolean AUTO_NATIVE_HANDOFF_ENABLED = false;\n    private static final long AUTO_NATIVE_FALLBACK_TIMEOUT_MS = 20000L;\n    private static final long NATIVE_TV_REPEAT_THROTTLE_MS = 85L;',
               'add repeat throttle constant')
          once('    private long debugKeyDispatchMaxNanos;\n    private int debugWebErrorCount;',
               '    private long debugKeyDispatchMaxNanos;\n    private long debugKeyDispatchSlowCount;\n    private long debugNativeTvRepeatSuppressedCount;\n    private long lastNativeTvDirectionalForwardAt;\n    private int debugWebErrorCount;',
               'add input counters')
          marker='''            if (isNativePlayerVisible()) {\n                result = super.dispatchKeyEvent(event);\n                recordDebugKeyDispatch(debugStarted);\n                return result;\n            }\n\n            if (customView == null && isCursorEnabled() && isCursorNavigationKey(keyCode)) {'''
          repl='''            if (isNativePlayerVisible()) {\n                result = super.dispatchKeyEvent(event);\n                recordDebugKeyDispatch(debugStarted);\n                return result;\n            }\n\n            if (customView == null && isNativeTvNavigationEnabled() && isCursorDirectionKey(keyCode)\n                    && action == KeyEvent.ACTION_DOWN) {\n                long now = SystemClock.uptimeMillis();\n                if (event.getRepeatCount() == 0) {\n                    lastNativeTvDirectionalForwardAt = now;\n                } else if (now - lastNativeTvDirectionalForwardAt < NATIVE_TV_REPEAT_THROTTLE_MS) {\n                    if (isDebugModeEnabled()) debugNativeTvRepeatSuppressedCount++;\n                    result = true;\n                    recordDebugKeyDispatch(debugStarted);\n                    return result;\n                } else {\n                    lastNativeTvDirectionalForwardAt = now;\n                }\n            }\n\n            if (customView == null && isCursorEnabled() && isCursorNavigationKey(keyCode)) {'''
          once(marker,repl,'insert native TV repeat throttle')
          once('''        if (elapsed > debugKeyDispatchMaxNanos) debugKeyDispatchMaxNanos = elapsed;\n    }''',
               '''        if (elapsed > debugKeyDispatchMaxNanos) debugKeyDispatchMaxNanos = elapsed;\n        if (elapsed >= 100_000_000L) debugKeyDispatchSlowCount++;\n    }''',
               'add slow dispatch counter')
          once('''        debugKeyDispatchMaxNanos = 0L;\n        debugWebErrorCount = 0;''',
               '''        debugKeyDispatchMaxNanos = 0L;\n        debugKeyDispatchSlowCount = 0L;\n        debugNativeTvRepeatSuppressedCount = 0L;\n        lastNativeTvDirectionalForwardAt = 0L;\n        debugWebErrorCount = 0;''',
               'reset input counters')
          once('''        out.append(String.format(Locale.US, "D-pad dispatch samples: %d; avg=%.3f ms; max=%.3f ms\\n", debugKeyEventCount, avgKeyMs, maxKeyMs));''',
               '''        out.append(String.format(Locale.US, "D-pad dispatch samples: %d; avg=%.3f ms; max=%.3f ms; >=100ms=%d\\n", debugKeyEventCount, avgKeyMs, maxKeyMs, debugKeyDispatchSlowCount));\n        out.append("Native TV repeat throttle: ").append(NATIVE_TV_REPEAT_THROTTLE_MS)\n                .append(" ms; suppressed=").append(debugNativeTvRepeatSuppressedCount).append('\\n');''',
               'report input counters')
          main=main.replace('Build 13 safety rollback','Build 14 stability guard')
          main=main.replace('Build13 native automatic launch disabled; crash-stage tracking enabled','Build14 native automatic launch disabled; D-pad repeat guard enabled')
          main=main.replace('Build 13 startup; automatic native launch disabled','Build 14 startup; automatic native launch disabled; native-TV repeat guard enabled')
          main=main.replace('automatic native launch disabled in Build 13','automatic native launch disabled in Build 14')
          main=main.replace('disabled by Build 13 safety rollback','disabled by Build 14 stability guard')
          main=main.replace('disabled in Build 13 after physical crash/regression','disabled in Build 14 after physical crash/regression')
          main=main.replace('DisneyNOWFireTV-Debug-v0.1-Build13-','DisneyNOWFireTV-Debug-v0.1-Build14-')
          main=main.replace('BuildConfig.APP_BUILD == 13 && BuildConfig.VERSION_CODE == 13','BuildConfig.APP_BUILD == 14 && BuildConfig.VERSION_CODE == 14')
          mainp.write_text(main)

          gradle=gradlep.read_text()
          if gradle.count('versionCode 13')!=1 or gradle.count("buildConfigField 'int', 'APP_BUILD', '13'")!=1: raise SystemExit('gradle Build13 precondition failed')
          gradle=gradle.replace('versionCode 13','versionCode 14').replace("buildConfigField 'int', 'APP_BUILD', '13'","buildConfigField 'int', 'APP_BUILD', '14'")
          gradlep.write_text(gradle)

          info=infop.read_text().replace('Build 13','Build 14').replace('Build13','Build14').replace('versionCode 13','versionCode 14')
          info += '\n\n## Build 14 lag/stability correction\n- Native TV Navigation now suppresses only rapid repeated directional ACTION_DOWN events inside an 85 ms guard window; initial directional presses and releases still pass through.\n- Adds privacy-safe counters for suppressed repeats and dispatches taking at least 100 ms.\n- Automatic native Media3 launch remains disabled; crash-stage breadcrumbs and all existing compatibility settings remain preserved.\n'
          infop.write_text(info)
          readme=readmep.read_text().replace('Build 13','Build 14').replace('Build13','Build14').replace('versionCode 13','versionCode 14')
          readme += '\n\n## Build 14 input-lag correction\nBuild 14 keeps the stable no-auto-native playback behavior and adds an 85 ms Native TV directional-repeat guard to prevent remote key-repeat floods from building a long WebView input queue. Single presses, releases, Select/Menu/Back, Cursor Navigation, Legacy Focus Navigation, crash breadcrumbs, Performance Mode, zoom, and Silk fallback are preserved. Debug reports now include suppressed-repeat and >=100 ms dispatch counts for physical comparison.\n'
          readmep.write_text(readme)

          audit=auditp.read_text()
          audit=audit.replace('Build13','Build14').replace('Build 13','Build 14')
          audit=audit.replace('versionCode\\s+13\\b','versionCode\\s+14\\b').replace("'13')", "'14')")
          audit=audit.replace("'APP_BUILD', '13'", "'APP_BUILD', '14'")
          audit=audit.replace('BuildConfig.APP_BUILD == 13 && BuildConfig.VERSION_CODE == 13','BuildConfig.APP_BUILD == 14 && BuildConfig.VERSION_CODE == 14')
          inject="""\n# Build 14 Native TV input-backlog correction.\nadd('Native TV repeat throttle constant is 85 ms', 'NATIVE_TV_REPEAT_THROTTLE_MS = 85L' in main, '85 ms')\nadd('Native TV repeat throttle is limited to directional ACTION_DOWN repeats', 'event.getRepeatCount() == 0' in main and 'now - lastNativeTvDirectionalForwardAt < NATIVE_TV_REPEAT_THROTTLE_MS' in main, 'initial press preserved, rapid repeats suppressed')\nadd('Suppressed native-TV repeats are counted without file logging', 'debugNativeTvRepeatSuppressedCount++' in main, 'privacy-safe in-memory counter')\nadd('Slow dispatch counter retained for physical comparison', 'debugKeyDispatchSlowCount++' in main and '100_000_000L' in main, '>=100 ms')\nadd('Debug snapshot reports repeat throttle evidence', 'Native TV repeat throttle:' in main and 'suppressed=' in main, 'physical comparison field')\n"""
          sentinel="\n# Write report.\n"
          if sentinel not in audit: raise SystemExit('static audit write-report sentinel missing')
          audit=audit.replace(sentinel,inject+sentinel)
          auditp.write_text(audit)

          post={r:hashlib.sha256((root/r).read_bytes()).hexdigest() for r in rels}
          zpath=Path('/tmp/build14-patch.zip')
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED) as z:
              for r in sorted(rels): z.write(root/r,r)
          zsha=hashlib.sha256(zpath.read_bytes()).hexdigest()
          enc=base64.b64encode(zpath.read_bytes()).decode('ascii')
          outdir=Path('DisneyNOWFireTV/Build14/patch_parts')
          outdir.mkdir(parents=True,exist_ok=True)
          for p in outdir.glob('part*.b64'): p.unlink()
          parts=[]
          for i in range(0,len(enc),9000):
              name=f'part{i//9000:02d}.b64'; (outdir/name).write_text(enc[i:i+9000]); parts.append(name)
          ap=Path('DisneyNOWFireTV/Build14/apply.py')
          ap.write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\nimport argparse,base64,hashlib,io,zipfile\nBASE='''+repr(base)+'''\nRESULT='''+repr(post)+'''\nPATCH_ZIP_SHA256='''+repr(zsha)+'''\nPATCH_PARTS='''+repr(parts)+'''\ndef sha(b): return hashlib.sha256(b).hexdigest()\ndef verify(root,expected,label):\n f=[]\n for r,w in expected.items():\n  p=root/r; g=sha(p.read_bytes()) if p.is_file() else 'missing'\n  if g!=w:f.append(f"{r}: expected {w}, got {g}")\n if f: raise SystemExit(label+' hash verification failed:\\n'+'\\n'.join(f))\ndef main():\n pa=argparse.ArgumentParser();pa.add_argument('--source',required=True);a=pa.parse_args();root=Path(a.source).resolve();verify(root,BASE,'Build 13 baseline')\n d=Path(__file__).resolve().parent/'patch_parts';data=base64.b64decode(''.join((d/n).read_text() for n in PATCH_PARTS),validate=True)\n if sha(data)!=PATCH_ZIP_SHA256: raise SystemExit('Build 14 patch ZIP SHA-256 mismatch')\n with zipfile.ZipFile(io.BytesIO(data)) as z:\n  if set(z.namelist())!=set(RESULT): raise SystemExit('Build 14 patch entries mismatch')\n  for r in RESULT:\n   b=z.read(r)\n   if sha(b)!=RESULT[r]: raise SystemExit('Build 14 payload hash mismatch: '+r)\n   p=(root/r).resolve()\n   if root not in p.parents: raise SystemExit('Unsafe Build 14 patch path: '+r)\n   p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)\n verify(root,RESULT,'Build 14 result');print('Build 14 lag/stability patch applied and verified.')\nif __name__=='__main__': main()\n''')
          print('BASE',base);print('RESULT',post);print('ZIP',zsha);print('PARTS',parts)
          PY
          rm -f DisneyNOWFireTV/Build14/_inspect_MainActivity_Build13.java DisneyNOWFireTV/Build14/_inspect_static_audit_Build13.py DisneyNOWFireTV/Build14/_inspect_build_gradle_Build13.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A DisneyNOWFireTV/Build14
          git commit -m 'Generate DisneyNOW Fire TV Build 14 lag stability patch'
          git push
