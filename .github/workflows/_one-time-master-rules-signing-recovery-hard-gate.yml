name: One-time MASTER_RULES signing recovery hard gate

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_one-time-master-rules-signing-recovery-hard-gate.yml'

permissions:
  contents: write

jobs:
  update_master_rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify current MASTER_RULES
        shell: bash
        run: |
          set -e
          test "$(git hash-object MASTER_RULES.md)" = "8dfded979df65ded2f84757cf8a678c664225186"

      - name: Apply signing recovery hard gate
        shell: bash
        run: python tools/_one_time_update_master_rules_signing.py

      - name: Verify updated rules
        shell: bash
        run: |
          set -e
          grep -Fq '### Signing and update-critical identity hard gate (all platforms)' MASTER_RULES.md
          grep -Fq 'create at least two durable recovery copies' MASTER_RULES.md
          grep -Fq 'perform a real recovery test from a backup copy' MASTER_RULES.md
          grep -Fq 'Release/build automation must fail closed' MASTER_RULES.md
          grep -Fq '## 19. Windows-specific rules' MASTER_RULES.md
          grep -Fq '## 20. Android rules' MASTER_RULES.md
          grep -Fq '## 21. iOS rules' MASTER_RULES.md
          grep -Fq '## 27. Permanent build archive' MASTER_RULES.md
          test "$(grep -c '^## [0-9][0-9]*\.' MASTER_RULES.md)" -eq 27
          git diff --check

      - name: Commit updated MASTER_RULES
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MASTER_RULES.md
          git diff --cached --quiet && exit 1
          git commit -m 'Strengthen cross-platform signing identity recovery rules'
          git push
