name: App Battery List Build 3 - Publish Permanent Pre-release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-battery-list-build3-publish-prerelease.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG_NAME: app-battery-list-v1.0-build3
      EXPECTED_ARTIFACT_ZIP_SHA256: 16a365637dc8abc9aea667427129dc5ad61a283d877d68f003c1a2e05109d8b8
      EXPECTED_APK_SHA256: 7ff2ef388d2394be8b902ddebbe27c64bb36ab8476200e713c07f3266cd1b12f
      EXPECTED_SOURCE_ZIP_SHA256: d9b3a9cce515a4b9919305417526f5b70e005c1b299fb5f654a2f80a9846492d
      ARTIFACT_URL: https://sdmntprwestus3.oaiusercontent.com/files/00000000-cb1c-81fd-937d-bd97e02dda3e/raw?se=2026-11-03T16%3A24%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=17c00889-5f00-5cc6-b88b-0195d6982b7a&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T00%3A04%3A37Z&ske=2026-11-04T00%3A04%3A37Z&sks=b&skv=2026-02-06&sig=aWGX3se9VgWjN6UuOVe8bOpJRZPQbwRJF9YnIYvDb7U%3D

    steps:
      - name: Checkout archive repository
        uses: actions/checkout@v4

      - name: Download exact verified private release artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 "$ARTIFACT_URL" -o /tmp/build3-artifact.zip
          actual="$(sha256sum /tmp/build3-artifact.zip | awk '{print $1}')"
          echo "Artifact ZIP SHA-256: $actual"
          test "$actual" = "$EXPECTED_ARTIFACT_ZIP_SHA256"
          mkdir -p /tmp/build3-release
          unzip -q /tmp/build3-artifact.zip -d /tmp/build3-release
          ls -l /tmp/build3-release

      - name: Verify exact release files before publication
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/build3-release
          test -s App-Battery-List-v1.0-Build-3-Permanent-Signed.apk
          test -s App-Battery-List-v1.0-Build-3-Source.zip
          test -s App-Battery-List-v1.0-Build-3-APKSIGNER.txt
          test -s App-Battery-List-v1.0-Build-3-BADGING.txt
          test -s App-Battery-List-v1.0-Build-3-RELEASE-VERIFY.txt
          test "$(sha256sum App-Battery-List-v1.0-Build-3-Permanent-Signed.apk | awk '{print $1}')" = "$EXPECTED_APK_SHA256"
          test "$(sha256sum App-Battery-List-v1.0-Build-3-Source.zip | awk '{print $1}')" = "$EXPECTED_SOURCE_ZIP_SHA256"
          grep -q 'PASS - package com.fireworkstars46.appbatterylist' App-Battery-List-v1.0-Build-3-RELEASE-VERIFY.txt
          grep -q 'PASS - versionName 1.0' App-Battery-List-v1.0-Build-3-RELEASE-VERIFY.txt
          grep -q 'PASS - versionCode 3 / Build 3' App-Battery-List-v1.0-Build-3-RELEASE-VERIFY.txt
          grep -q 'PASS - apksigner verification passed' App-Battery-List-v1.0-Build-3-RELEASE-VERIFY.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: bb7fd523c767327028075ff78b1d50d2b55b79571a3e4651c2bf23f2bb4f4393' App-Battery-List-v1.0-Build-3-APKSIGNER.txt
          grep -q "package: name='com.fireworkstars46.appbatterylist' versionCode='3' versionName='1.0'" App-Battery-List-v1.0-Build-3-BADGING.txt

      - name: Refuse tag or release reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "ERROR: tag already exists: $TAG_NAME" >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: release already exists: $TAG_NAME" >&2
            exit 1
          fi

      - name: Publish permanent GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          # App Battery List v1.0 Build 3 — Permanent Signed Pre-release

          Build 3 adds the requested smoother Guided Review workflow.

          - Package: `com.fireworkstars46.appbatterylist`
          - versionName: `1.0`
          - versionCode / Build: `3`
          - Permanent signer SHA-256: `BB:7F:D5:23:C7:67:32:70:28:07:5F:F7:8B:1D:50:D2:B5:5B:79:57:1A:3E:46:51:C2:BF:23:F2:BB:4F:43:93`
          - APK SHA-256: `7ff2ef388d2394be8b902ddebbe27c64bb36ab8476200e713c07f3266cd1b12f`
          - Source ZIP SHA-256: `d9b3a9cce515a4b9919305417526f5b70e005c1b299fb5f654a2f80a9846492d`
          - Durable signing backup + real recovery test: **PASS**
          - Exact source reconstruction/hash verification: **PASS**
          - Release compile/package/signature verification: **PASS**

          ## New in Build 3
          Guided Review now offers **Auto Review**. App Battery List opens an app's App Info page; after you make the battery choice and return from Settings, the app can advance to the next saved review item automatically. Manual Review and the existing Done & Next / Skip & Next controls remain available as fallbacks.

          Android/Samsung does not expose a supported public API for directly opening Samsung's arbitrary per-app Optimized/Unrestricted/Restricted three-choice page or changing that choice for another app, so Build 3 does not use hidden APIs, Accessibility auto-clicking, root, or ADB.

          ## Current validation status
          Physical Galaxy S22 Auto Review Settings return loop: **NOT TESTED**.
          Safe Self-Test on the physical Galaxy S22: **NOT TESTED**.
          Secure Folder runtime: **NOT TESTED**.

          Therefore this release is intentionally **Pre-release / NOT DONE** until the on-device checks pass. These Build 3 APK bytes must not be replaced under this tag.
          EOF

          cd /tmp/build3-release
          cp App-Battery-List-v1.0-Build-3-Permanent-Signed.apk App-Battery-List-v1.0-Build-3.apk
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'App Battery List v1.0 Build 3 — Permanent Signed Pre-release' \
            --notes-file /tmp/release-notes.md \
            --prerelease \
            App-Battery-List-v1.0-Build-3.apk \
            App-Battery-List-v1.0-Build-3-Source.zip \
            App-Battery-List-v1.0-Build-3.apk.sha256 \
            App-Battery-List-v1.0-Build-3-Source.zip.sha256 \
            App-Battery-List-v1.0-Build-3-APKSIGNER.txt \
            App-Battery-List-v1.0-Build-3-BADGING.txt \
            App-Battery-List-v1.0-Build-3-RELEASE-VERIFY.txt

      - name: Verify permanent release assets are retrievable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/redownload
          cd /tmp/redownload
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'App-Battery-List-v1.0-Build-3.apk'
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'App-Battery-List-v1.0-Build-3-Source.zip'
          test "$(sha256sum App-Battery-List-v1.0-Build-3.apk | awk '{print $1}')" = "$EXPECTED_APK_SHA256"
          test "$(sha256sum App-Battery-List-v1.0-Build-3-Source.zip | awk '{print $1}')" = "$EXPECTED_SOURCE_ZIP_SHA256"
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease,tagName --jq 'select(.isPrerelease == true and .tagName == env.TAG_NAME)' >/dev/null
